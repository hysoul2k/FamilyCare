name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx eslint lib/server/database.mjs lib/server/supabase.mjs lib/server/postgres-sql.mjs utils/supabase scripts/check-supabase.mjs scripts/prepare-supabase.mjs tests/supabase.test.mjs tests/database-config.test.mjs
